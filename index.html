        <div class="controle">
            <label for="angulo">Ângulo(˚)</label>

        </div>
 <button onclick="lancar()">Lançar</button>
    </div>
    <canvas
        id="campo"
        width="1000"
        height="500">
    </canvas>
<div class="informacoes">
<h2>Fórmulas utilizadas</h2>
<p><strong>Velocidade Horizontal:</strong> Vx=Vo*sen(θ)</p>
<p><strong>Velocidade Vertical:</strong> Vx=Vo*cos(θ)</p>
<p><strong>Movimento Horizontal:</strong> x=Vx*tempo</p>
<p><strong>Movimento Vertical:</strong> y=Vyt-(gt²)/2</p>
<p><strong>Gravidade:</strong> g≈9,8m/s²</p>
